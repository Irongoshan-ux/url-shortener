version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/repository/sqlc/schema"
    queries: "internal/repository/sqlc/queries"
    gen:
      go:
        package: "db"
        out: "internal/repository/sqlc/db"
        sql_package: "pgx/v5"
        emit_interface: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
